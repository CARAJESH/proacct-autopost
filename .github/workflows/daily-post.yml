name: Daily Instagram post

on:
  schedule:
    # 13:20 UTC = 6:50 pm IST. GitHub can start scheduled runs a few minutes late.
    - cron: "20 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show the post, publish nothing)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Publish today's carousel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python post.py

      - name: Save progress
        if: success()
        run: |
          if git diff --quiet state.json; then
            echo "Nothing to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Posted day $(python -c 'import json;print(json.load(open("state.json"))["next"]-1)')"
          git push
